<app-navbar></app-navbar>
<div class="flex flex-column align-items-center p-5 surface-ground" style="min-height: calc(100vh - 160px);">

    <div class="bg-white p-4 border-round shadow-1 w-full max-w-30rem text-center mb-4">
        <p-avatar label="PR" styleClass="mr-2" size="xlarge" shape="circle" [style]="{'background-color': '#d1fae5', 'color': '#065f46', 'width': '80px', 'height': '80px', 'font-size': '2rem'}"></p-avatar>
        <h2 class="mt-3 mb-0 text-900">{{ userData.full_name }}</h2>
    </div>

    <div class="bg-white p-5 border-round shadow-1 w-full max-w-50rem">
        <div class="flex justify-content-between align-items-center mb-4">
            <h3 class="m-0 text-700">Información Personal</h3>
            <button pButton label="Editar Perfil" class="p-button-success" (click)="enableEdit()" *ngIf="!isEditing"></button>
            <button pButton label="Guardar" class="p-button-primary" (click)="saveChanges()" *ngIf="isEditing"></button>
        </div>

        <div class="grid p-fluid">
            <div class="col-12 md:col-6 mb-3">
                <label class="font-bold block mb-2">Nombre Completo</label>
                <input pInputText [(ngModel)]="userData.full_name" [disabled]="!isEditing" />
            </div>
            <div class="col-12 md:col-6 mb-3">
                <label class="font-bold block mb-2">Correo Electrónico</label>
                <input pInputText [(ngModel)]="userData.email" [disabled]="!isEditing" />
            </div>
            <div class="col-12 md:col-6 mb-3">
                <label class="font-bold block mb-2">Teléfono</label>
                <input pInputText [(ngModel)]="userData.phone" [disabled]="!isEditing" />
            </div>
            <div class="col-12 md:col-6 mb-3">
                <label class="font-bold block mb-2">ID</label>
                <input pInputText [(ngModel)]="userData.student_id" [disabled]="!isEditing" />
            </div>
        </div>
    </div>

</div>
<div class="bg-green-700 text-white text-center p-3 text-sm mt-auto">
    © 2025 Universidad de Nariño - SentioApp<br>
    Todos los derechos reservados. Sistema de Gestión de Bienestar Estudiantil
</div>
