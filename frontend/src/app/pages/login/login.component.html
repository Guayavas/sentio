<div class="flex flex-column align-items-center justify-content-center min-h-screen surface-ground">

    <div class="flex align-items-center gap-2 mb-5 text-green-700">
        <i class="pi pi-folder-open" style="font-size: 2rem;"></i>
        <div class="flex flex-column">
            <span class="font-bold text-xl">SentioApp</span>
            <span class="text-sm">Bienestar Estudiantil</span>
        </div>
    </div>

    <p-card header="Iniciar Sesión" [style]="{ width: '400px' }" class="text-center">
        <ng-template pTemplate="subtitle">
            Accede al sistema de bienestar estudiantil
        </ng-template>
        <div class="flex flex-column gap-4 p-fluid text-left">
            <div class="field">
                <label for="email" class="block text-900 font-medium mb-2">Usuario</label>
                <input id="email" type="text" pInputText placeholder="Ingresa tu usuario" [(ngModel)]="email" />
            </div>
            <div class="field">
                <label for="password" class="block text-900 font-medium mb-2">Contraseña</label>
                <input id="password" type="password" pPassword [feedback]="false" placeholder="........" [(ngModel)]="password" class="w-full" />
            </div>
            <button pButton label="Iniciar Sesión" class="p-button-success w-full" (click)="login()"></button>
        </div>
    </p-card>

    <div class="mt-auto w-full bg-green-700 text-white text-center p-3 text-sm">
        © 2025 Universidad de Nariño - SentioApp<br>
        Todos los derechos reservados. Sistema de Gestión de Bienestar Estudiantil
    </div>
</div>
