version: '3.8'
services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    container_name: sentio_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentio_db
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: always

  # Servicio de Backend (Node.js)
  # Nota: En producción o despliegue completo, incluiríamos el backend aquí.
  # Para desarrollo/demo, podemos correr el backend localmente o aquí.
  # Lo dejaremos preparado para correr la DB primero.
